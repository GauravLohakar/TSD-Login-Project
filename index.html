<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Authentication</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <!-- ================= LOGIN FORM ================= -->

        <div class="form-box active" id="login-box">

            <h2>Welcome Back</h2>

            <form action="login.php" method="POST">

                <div class="input-group">
                    <input type="email" name="email" maxlength="255" autocomplete="email" required>
                    <label>Email Address</label>
                </div>

                <div class="input-group">
                    <input type="password" name="password" autocomplete="current-password" required>
                    <label>Password</label>
                </div>

                <button type="submit" class="btn">
                    Sign In
                </button>

                <p class="toggle-text">
                    Don't have an account?
                    <span onclick="toggleForms()">Register</span>
                </p>

            </form>

        </div>


        <!-- ================= REGISTRATION FORM ================= -->

        <div class="form-box hidden" id="register-box">

            <h2>Create Account</h2>

            <form action="register.php" method="POST">

                <div class="input-group">
                    <input type="text" name="fullname" maxlength="120" autocomplete="name" required>
                    <label>Full Name</label>
                </div>

                <div class="input-group">
                    <input type="email" name="email" maxlength="255" autocomplete="email" required>
                    <label>Email Address</label>
                </div>

                <div class="input-group">
                    <input type="password" name="password" minlength="8" autocomplete="new-password" required>
                    <label>Password</label>
                </div>

                <button type="submit" class="btn">
                    Sign Up
                </button>

                <p class="toggle-text">
                    Already have an account?
                    <span onclick="toggleForms()">Sign In</span>
                </p>

            </form>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
